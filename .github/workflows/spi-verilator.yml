name: Verilator

on:
  push:
    paths: ['rtl/**', 'tb/**', 'Makefile', 'compile*.f', '.github/workflows/spi-verilator.yml']
  pull_request:
    paths: ['rtl/**', 'tb/**', 'Makefile', 'compile*.f', '.github/workflows/spi-verilator.yml']
  workflow_dispatch:

jobs:
  simulate:
    name: Lint + regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator and Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator iverilog
          verilator --version
          iverilog -V 2>&1 | sed -n 1p

      - name: Lint
        run: make lint

      # $finish always exits 0, so the log text is what gates the job.
      - name: Smoke test
        run: |
          set -o pipefail
          make smoke 2>&1 | tee smoke.log
          grep -q "ALL CHECKS PASSED" smoke.log

      - name: Mode / bit-order / DFS sweep
        run: |
          set -o pipefail
          make modes 2>&1 | tee modes.log
          grep -q "ALL MODES PASS" modes.log

      - name: Slave-mode regression (Verilator)
        run: |
          set -o pipefail
          make slave 2>&1 | tee slave.log
          grep -q "ALL SLAVE CASES PASS" slave.log

      # 4-state run: a flop with no reset stays X here (Verilator would hide it)
      - name: Slave-mode regression (Icarus, 4-state)
        run: |
          set -o pipefail
          make slave-ivl 2>&1 | tee slave_ivl.log
          grep -q "ALL SLAVE CASES PASS" slave_ivl.log

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: |
            smoke.log
            modes.log
            slave.log
            slave_ivl.log
          if-no-files-found: ignore
